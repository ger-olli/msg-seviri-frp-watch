name: MSG SEVIRI FRP Watch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msg-seviri-frp-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check LSA-502 MSG SEVIRI fire pixels
        env:
          LSASAF_USERNAME: ${{ secrets.LSASAF_USERNAME }}
          LSASAF_PASSWORD: ${{ secrets.LSASAF_PASSWORD }}
        run: python msg_watch.py
      - name: Build persistent 24h event window
        run: python build_recent_events.py --events data/msg_events.jsonl --output data/msg_recent_events.json --hours 24
      - name: Commit status data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update MSG SEVIRI LSA-502 hotspot status"
            git pull --rebase origin main
            git push
          fi
